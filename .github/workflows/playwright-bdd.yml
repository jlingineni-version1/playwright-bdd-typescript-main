name: Playwright BDD Daily Run

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 6 AM UTC
  workflow_dispatch:

  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify snapshot folder exists
        run: |
          echo "Verifying connectivityToolMap snapshot folder..."
          ls -l .features-gen/tests/features/connectivityToolMap.feature.spec.js-snapshots/
    
          echo "Verifying home feature snapshot folder..."
          ls -l .features-gen/tests/features/home.feature.spec.js-snapshots/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright BDD tests
        env:
          TEST_ENV: test
        run: npm run test
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

          
