name: Playwright BDD Daily Run

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 6 AM UTC
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  e2e-tests:
    runs-on: windows-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show branch and commit
        shell: pwsh
        run: |
          Write-Host "Branch: $env:GITHUB_REF"
          Write-Host "Commit: $env:GITHUB_SHA"

      # -----------------------------
      # Restore snapshot artifacts (if present)
      # -----------------------------
      - name: Download snapshot artifact
        uses: actions/download-artifact@v4
        with:
          name: snapshot-artifacts
          path: .
        continue-on-error: true

      # -----------------------------
      # Node setup
      # -----------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install

      # -----------------------------
      # Generate BDD tests
      # -----------------------------
      - name: Generate BDD tests
        run: npm run bdd:generate

      # -----------------------------
      # OPTIONAL: One-time snapshot generation
      # REMOVE this once snapshots exist!
      # -----------------------------
      - name: Generate Windows snapshots (one-time)
        if: always()
        run: npx playwright test --update-snapshots

      # -----------------------------
      # Windows: Skip PNG validation
      # -----------------------------
      - name: Skip PNG signature validation on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Skipping PNG header validation (Windows snapshots differ by OS)."

      # -----------------------------
      # Run Playwright BDD tests
      # -----------------------------
      - name: Run Playwright BDD tests
        env:
          TEST_ENV: test
        run: npm test

      # -----------------------------
      # Debug snapshot inspection
      # -----------------------------
      - name: List snapshot directories and files
        if: always()
        shell: pwsh
        run: |
          Write-Host "Snapshot directories:"
          Get-ChildItem ".features-gen" -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "*.feature.spec.js-snapshots" } |
            ForEach-Object {
              Write-Host $_.FullName
              Get-ChildItem -Force $_.FullName
            }

          Write-Host "PNG snapshot files:"
          Get-ChildItem ".features-gen" -Recurse -Include *.png -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }

          Write-Host "Test results:"
          if (Test-Path "test-results") { Get-ChildItem -Force "test-results" } else { Write-Host "No test-results folder" }

      # -----------------------------
      # Upload updated snapshots + test results
      # -----------------------------
      - name: Upload snapshots and test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-artifacts
          path: |
            .features-gen/**/*.feature.spec.js-snapshots/**
            .features-gen/**/*.png
            test-results/**
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7