name: Playwright BDD Daily Run

on:
  schedule:
    - cron: '0 18 * * *'   # Daily at 6 PM UTC
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  e2e-tests:
    runs-on: windows-latest   # <--- WINDOWS

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show current branch and commit
        shell: pwsh
        run: |
          Write-Host "Branch: $env:GITHUB_REF"
          Write-Host "Commit: $env:GITHUB_SHA"

      # -----------------------------
      # Node setup
      # -----------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # --with-deps is Linux-only
        run: npx playwright install

      # -----------------------------
      # Clean old snapshots
      # -----------------------------
      - name: Clean .features-gen and old snapshots
        shell: pwsh
        run: |
          Write-Host "Cleaning generated features and snapshots"
          if (Test-Path ".features-gen") { Remove-Item ".features-gen" -Recurse -Force -ErrorAction SilentlyContinue }
          Get-ChildItem -Recurse -Include *.png -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          if (Test-Path "test-results") { Remove-Item "test-results" -Recurse -Force -ErrorAction SilentlyContinue }
          if (Test-Path "playwright-report") { Remove-Item "playwright-report" -Recurse -Force -ErrorAction SilentlyContinue }

      # -----------------------------
      # Generate BDD tests
      # -----------------------------
      - name: Generate BDD tests
        run: npm run bdd:generate

      # -----------------------------
      # ONE-TIME SNAPSHOT CREATION
      # Remove once snapshots are committed or stored via artifacts
      # -----------------------------
      - name: Generate Windows snapshots (one-time)
        run: npx playwright test --update-snapshots

      # -----------------------------
      # PNG validation -- DISABLED ON WINDOWS
      # Only Linux should validate PNG signatures
      # -----------------------------
      - name: Skip PNG validation on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Skipping PNG signature validation on Windows (expected differences)."

      # -----------------------------
      # Run Playwright BDD tests
      # -----------------------------
      - name: Run Playwright BDD tests
        env:
          TEST_ENV: test
        run: npm test

      # -----------------------------
      # Debug output
      # -----------------------------
      - name: List produced snapshot and test results
        if: always()
        shell: pwsh
        run: |
          Write-Host "Snapshot directories:"
          Get-ChildItem -Path ".features-gen" -Recurse -Directory -ErrorAction SilentlyContinue `
            | Where-Object { $_.Name -like "*.feature.spec.js-snapshots" } `
            | ForEach-Object {
                Write-Host $_.FullName
                Get-ChildItem -Force $_.FullName
              }

          Write-Host "PNG snapshot files:"
          Get-ChildItem -Path ".features-gen" -Recurse -Include *.png -ErrorAction SilentlyContinue `
            | ForEach-Object { Write-Host $_.FullName }

          Write-Host "Test results:"
          if (Test-Path "test-results") {
            Get-ChildItem -Force "test-results"
          } else {
            Write-Host "test-results not found"
          }

      # -----------------------------
      # Upload artifacts
      # -----------------------------
      - name: Upload snapshots and test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-artifacts
          path: |
            .features-gen/**/*.feature.spec.js-snapshots/**
            .features-gen/**/*.png
            test-results/**
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7