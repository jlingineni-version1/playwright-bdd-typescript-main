name: Playwright BDD Daily Run

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 6 AM UTC
  workflow_dispatch:

  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

         # Step to debug repository contents and verify snapshot folders
      - name: Show current branch and commit
        run: |
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"

      - name: List repository files
        run: |
          ls -R

      - name: Verify snapshot folder exists
        run: |
          echo "Verifying connectivityToolMap snapshot folder..."
          ls -R .features-gen/tests/features/connectivityToolMap.feature.spec.js-snapshots/
    
          echo "Verifying home feature snapshot folder..."
          if [ -d ".features-gen/tests/features/home.feature.spec.js-snapshots/" ]; then
            ls -R .features-gen/tests/features/home.feature.spec.js-snapshots/
          else
            echo "Warning: home.feature.spec.js-snapshots/ directory not found."
          fi

          echo "Finding snapshot files..."
          find . -type f -name "*.png"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright BDD tests
        env:
          TEST_ENV: test
        run: npm test

      - name: List produced snapshot and test results
        if: always()
        run: |
          echo "Listing snapshot directories (for debugging)..."
          find . -type d -name "*.feature.spec.js-snapshots" -print -exec ls -la {} \; || true
          echo "Listing png snapshot files..."
          find . -type f -name "*.png" -print || true
          echo "Listing test-results directory..."
          ls -la test-results || true

      - name: Upload snapshots and test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-artifacts
          path: |
            .features-gen/**/*.feature.spec.js-snapshots/**
            .features-gen/**/*.png
            test-results/**
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

          
